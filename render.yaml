services:
  - type: web
    name: mutatio-nexus
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MUTATIO_DATA_DIR
        value: /tmp/mutatio-data
